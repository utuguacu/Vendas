<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="N&amp;L">
<meta name="theme-color" content="#F4F1EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icones/favicon-32.png">
<script src="firebase-config.js"></script>
<title>N&amp;L</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F1EC;--card:#FFFFFF;--line:#E4DED5;--line2:#EFEAE2;--ink:#1F1D1A;--muted:#6B655C;--accent:#7A6A58;--soft:#FAF8F5;--chip:#EFEAE2;
--c-nicole:#C9A38C;--c-lucas:#4F5E57;--c-casal:#9C7A55;--c-lembrete:#CFC8BD}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.serif{font-family:'Cormorant Garamond',serif;font-weight:500}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 10px;gap:10px}
.who{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:18px}
.av.n{background:#E9E3DA;color:var(--ink)}.av.l{background:var(--ink);color:var(--bg)}
.main{flex:1;padding:6px 22px 28px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:34px;line-height:1.1}
.sub{margin:4px 0 0;font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card h2{margin:0;font-size:15px;font-weight:600}
.label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.dark .label{color:#CFC6B8}
.muted{color:var(--muted);font-size:13px;line-height:1.5}
.dark .muted{color:#CFC6B8}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.stat b{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:24px;line-height:1.15}
.btn{background:var(--ink);color:var(--bg);border:none;border-radius:12px;min-height:46px;padding:0 16px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid #D9D2C7}
.btn.sm{min-height:44px;padding:0 14px;font-size:13px;border-radius:999px}
.row{display:flex;gap:8px;align-items:center}
.wrapr{display:flex;gap:8px;flex-wrap:wrap}
.pill{border-radius:999px;padding:0 14px;min-height:44px;font-size:13px;border:1px solid #D9D2C7;background:#fff;color:var(--ink)}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:3px}
.seg button{border:none;background:transparent;border-radius:999px;height:38px;padding:0 14px;font-size:12px}
.seg button.on{background:var(--ink);color:var(--bg)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
input.i,select.i,textarea.i{width:100%;min-width:0;border:1px solid #D9D2C7;background:var(--soft);border-radius:12px;padding:0 12px;height:46px;font-size:15px;color:var(--ink)}
textarea.i{height:auto;padding:12px;line-height:1.5;resize:vertical}
input.i:focus,select.i:focus,textarea.i:focus{outline:2px solid var(--accent);outline-offset:1px}
.link{display:flex;justify-content:space-between;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 16px;min-height:52px;font-size:15px;color:var(--ink);width:100%}
.link span:last-child{color:var(--accent)}
.item{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line2);padding-top:12px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block}
.check{display:flex;align-items:center;gap:12px;background:transparent;border:none;border-top:1px solid var(--line2);padding:10px 0;text-align:left;width:100%;min-height:46px}
.box{width:20px;height:20px;border-radius:6px;border:1px solid #B9AE9F;flex-shrink:0}
.box.on{background:var(--ink);border-color:var(--ink)}
.x{background:transparent;border:none;color:var(--muted);width:44px;height:44px;border-radius:50%;font-size:18px;flex-shrink:0}
.nav{position:sticky;bottom:0;display:flex;border-top:1px solid var(--line);background:#FBFAF7;padding:6px 8px calc(10px + env(safe-area-inset-bottom))}
.nav button{flex:1;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;min-height:50px;color:var(--muted);font-size:12px;font-weight:500}
.nav button i{width:18px;height:2px;border-radius:2px;background:transparent}
.nav button.on{color:var(--ink)}.nav button.on i{background:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.cal .wd{font-size:11px;color:var(--muted);padding:4px 0}
.cal button{height:46px;border-radius:10px;border:1px solid transparent;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;font-size:13px}
.cal button.today{border-color:var(--ink);font-weight:600}
.cal button.sel{background:var(--ink);color:var(--bg)}
.cal .dots{display:flex;gap:2px;height:6px}.cal .dots span{width:6px;height:6px;border-radius:50%}
.evd{display:flex;flex-direction:column;gap:3px;border-left:3px solid;background:var(--soft);border-radius:0 10px 10px 0;padding:10px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:13px;max-width:90vw;z-index:9;box-shadow:0 6px 24px rgba(0,0,0,.15)}
.ai{background:var(--bg);border-radius:12px;padding:14px;font-size:14px;line-height:1.55;color:#3A3631;white-space:pre-wrap}
.status{font-size:11px;background:var(--chip);color:#5E5448;border-radius:999px;padding:5px 10px;white-space:nowrap}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px dashed #CFC6B8;border-radius:16px;padding:22px;background:var(--soft);text-align:center;cursor:pointer;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hello{flex:1;display:flex;flex-direction:column;justify-content:center;gap:40px;padding:40px 28px}
.pick{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px 12px;display:flex;flex-direction:column;align-items:center;gap:14px;font-size:16px;font-weight:500}
.pick .av{width:76px;height:76px;font-size:36px}
.banner{background:#FFF7EA;border:1px solid #EAD9BC;color:#5E4A2A;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5}
video{width:100%;border-radius:12px;background:#000}
a{color:var(--accent)}
@media (min-width:900px){.wrap{max-width:640px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" class="toast" role="status" hidden></div>
<p class="ver" hidden>2026.11.10-2</p>
<script>
(function(){
'use strict';
// ---------- helpers ----------
const $app = document.getElementById('app');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const pad = (n) => String(n).padStart(2, '0');
const isoOf = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hojeISO = () => isoOf(new Date());
const mesAtualKey = () => hojeISO().slice(0, 7);
const NOMES = { nicole: 'Nicole', lucas: 'Lucas', casal: 'Os dois', lembrete: 'Lembrete' };
const CORES = { nicole: '#C9A38C', lucas: '#4F5E57', casal: '#9C7A55', lembrete: '#CFC8BD' };
const AVISOS = [['nenhum','Sem aviso',null],['0','Na hora',0],['30m','30 minutos antes',30],['1h','1 hora antes',60],['1d','1 dia antes',1440],['1s','1 semana antes',10080]];
const avisoTxt = (k) => { const a = AVISOS.find((x) => x[0] === k); return a ? a[1] : ''; };
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} };
const rel = (t) => { const m = Math.round((Date.now() - t) / 60000); if (m < 1) return 'agora'; if (m < 60) return 'há ' + m + ' min'; const h = Math.round(m / 60); if (h < 24) return 'há ' + h + ' h'; const d = Math.round(h / 24); return 'há ' + d + (d === 1 ? ' dia' : ' dias'); };
const fmtData = (iso) => { if (!iso) return ''; const p = iso.split('-'); return parseInt(p[2], 10) + ' ' + MESES[parseInt(p[1], 10) - 1]; };
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3500); }

// ---------- state ----------
const S = {
  perfil: lsGet('nl-perfil'), tab: 'inicio', vista: 'lista', filtro: 'todos',
  cal: null, diaSel: null, drafts: {}, busy: {}, stream: {}, busca: null,
  conectado: 'carregando', aiOk: true, open: {}, sug: {}
};
const D = { eventos: [], compras: [], atividades: [], projetos: [], videos: [], contas: [], config: {}, cardapio: {}, analises: {}, clientes: [] };
let db = null, sample = null, dict = null, assets = null;

// ---------- data layer ----------
// Firebase (Firestore + Auth) quando nl/firebase-config.js estiver preenchido; senão, dados só neste aparelho.
const FB = { app: null, db: null, auth: null, m: null, user: null };
const LOCAL_KEY = 'nl-dados-v1';
const local = { data: {}, subs: {} };
function localLoad(){ try { local.data = JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}') || {}; } catch (e) { local.data = {}; } }
function localSave(){ try { localStorage.setItem(LOCAL_KEY, JSON.stringify(local.data)); } catch (e) {} }
function localEmit(name){ const col = local.data[name] || {}; const arr = Object.keys(col).map((id) => Object.assign({}, col[id], { id: id })); (local.subs[name] || []).forEach((cb) => cb(arr)); }
function listen(name, cb){
  const wrap = (arr) => { cb(arr); if (S.conectado !== 'ok' && S.conectado !== 'local') S.conectado = FB.db ? 'ok' : 'local'; render(); };
  if (FB.db) {
    const { collection, onSnapshot } = FB.m;
    onSnapshot(collection(FB.db, name), (snap) => { wrap(snap.docs.map((d) => Object.assign({}, d.data(), { id: d.id }))); }, (err) => { console.log('[NL] listen', name, err); if (err && err.code === 'permission-denied') { S.conectado = 'negado'; render(); } });
  } else {
    (local.subs[name] = local.subs[name] || []).push(wrap); localEmit(name);
  }
}
async function put(name, id, obj){
  try {
    if (FB.db) { await FB.m.setDoc(FB.m.doc(FB.db, name, id), obj); }
    else { local.data[name] = local.data[name] || {}; local.data[name][id] = obj; localSave(); localEmit(name); }
    return true;
  } catch (e) { console.log('[NL] put', e); toast('Não consegui salvar. Tente de novo.'); return false; }
}
async function patch(name, id, obj){
  const cur = name === 'config' ? (id === 'geral' ? D.config : {}) : (name === 'cardapio' ? D.cardapio : ((D[name] || []).find ? (D[name].find((x) => x.id === id) || {}) : {}));
  const base = Object.assign({}, cur); delete base.id;
  return put(name, id, Object.assign(base, obj));
}
async function del(name, id){
  try {
    if (FB.db) await FB.m.deleteDoc(FB.m.doc(FB.db, name, id));
    else { if (local.data[name]) delete local.data[name][id]; localSave(); localEmit(name); }
  } catch (e) { toast('Não consegui apagar.'); }
}
function log(texto){
  const id = uid();
  put('atividades', id, { perfil: S.perfil, texto: texto, em: Date.now() });
  const antigos = D.atividades.slice().sort((a, b) => b.em - a.em).slice(30);
  antigos.forEach((a) => del('atividades', a.id));
}
function assinarTudo(){
  listen('eventos', (d) => { D.eventos = d; });
  listen('compras', (d) => { D.compras = d; });
  listen('atividades', (d) => { D.atividades = d; });
  listen('projetos', (d) => { D.projetos = d; });
  listen('videos', (d) => { D.videos = d; });
  listen('contas', (d) => { D.contas = d; });
  listen('clientes', (d) => { D.clientes = d; });
  listen('config', (d) => { D.config = d.find((x) => x.id === 'geral') || {}; });
  listen('cardapio', (d) => { D.cardapio = d.find((x) => x.id === 'semana') || {}; });
  listen('analises', (d) => { const m = {}; d.forEach((x) => { m[x.id] = x; }); D.analises = m; });
}
async function boot(){
  render();
  const cfg = window.NL_FIREBASE;
  if (!cfg || !cfg.apiKey) { localLoad(); S.conectado = 'local'; assinarTudo(); render(); return; }
  try {
    const V = '10.12.2';
    const [a, f, au] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/' + V + '/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/' + V + '/firebase-firestore.js'),
      import('https://www.gstatic.com/firebasejs/' + V + '/firebase-auth.js')
    ]);
    FB.m = Object.assign({}, f, au);
    FB.app = a.initializeApp(cfg);
    FB.auth = au.getAuth(FB.app);
    try { await au.setPersistence(FB.auth, au.browserLocalPersistence); } catch (e) {}
    au.onAuthStateChanged(FB.auth, (u) => {
      FB.user = u;
      if (u && !FB.db) {
        FB.db = f.initializeFirestore(FB.app, { localCache: f.persistentLocalCache ? f.persistentLocalCache() : undefined });
        const mapa = window.NL_PERFIS || {};
        const p = mapa[(u.email || '').toLowerCase()];
        if (p && !S.perfil) { S.perfil = p; lsSet('nl-perfil', p); }
        S.conectado = 'carregando'; assinarTudo();
      }
      if (!u) { S.conectado = 'login'; }
      render();
    });
  } catch (e) {
    console.log('[NL] firebase', e);
    localLoad(); S.conectado = 'local'; assinarTudo(); render();
  }
}
async function entrarEmail(criar){
  const email = val('lg-email').trim(); const senha = val('lg-senha');
  if (!email || senha.length < 6) { toast('Preencha o e-mail e uma senha de pelo menos 6 caracteres.'); return; }
  S.busy.login = true; render();
  try {
    if (criar) await FB.m.createUserWithEmailAndPassword(FB.auth, email, senha);
    else await FB.m.signInWithEmailAndPassword(FB.auth, email, senha);
    clear('lg-senha');
  } catch (e) {
    const c = (e && e.code) || '';
    toast(c.includes('invalid-credential') || c.includes('wrong-password') ? 'E-mail ou senha incorretos.' : c.includes('email-already') ? 'Esse e-mail já tem conta. Toque em Entrar.' : c.includes('user-not-found') ? 'Conta não encontrada. Toque em Primeiro acesso.' : 'Não consegui entrar. Confira a internet e tente de novo.');
  }
  S.busy.login = false; render();
}
function telaLogin(){
  return `<div class="hello">
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center">
      <div class="serif" style="font-size:26px;letter-spacing:.3em;color:var(--accent)">N&amp;L</div>
      <h1 style="font-size:38px">Entrar</h1>
      <p class="muted" style="margin:0">Use o seu e-mail. No primeiro acesso, crie uma senha.</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <label class="f">E-mail<input class="i" id="lg-email" type="email" autocomplete="username" inputmode="email" value="${esc(S.drafts['lg-email'] || '')}" style="background:#fff"></label>
      <label class="f">Senha<input class="i" id="lg-senha" type="password" autocomplete="current-password" value="${esc(S.drafts['lg-senha'] || '')}" style="background:#fff"></label>
      <button class="btn" data-a="login" ${S.busy.login ? 'disabled' : ''}>${S.busy.login ? 'Entrando…' : 'Entrar'}</button>
      <button class="btn ghost" data-a="primeiro" ${S.busy.login ? 'disabled' : ''}>Primeiro acesso</button>
    </div>
  </div>`;
}

// ---------- agenda logic ----------
const passaFiltro = (e) => S.filtro === 'todos' || e.quem === S.filtro || (S.filtro !== 'lembrete' && (e.quem === 'casal' || e.quem === 'lembrete'));
function ocorreEm(e, iso){ if (!e.data) return false; if (e.data === iso) return true; return !!e.anual && e.data.slice(5) === iso.slice(5) && e.data <= iso; }
function eventosDoDia(iso, filtrar){ return D.eventos.filter((e) => ocorreEm(e, iso) && (!filtrar || passaFiltro(e))).sort((a, b) => (a.hora || '').localeCompare(b.hora || '')); }
function proximaOcorrencia(e){
  const hj = hojeISO();
  let data = e.data;
  if (e.anual) { const y = new Date().getFullYear(); data = y + e.data.slice(4); if (data < hj) data = (y + 1) + e.data.slice(4); }
  const [y, m, d] = data.split('-').map(Number);
  const [hh, mm] = (e.hora || '09:00').split(':').map(Number);
  return new Date(y, m - 1, d, hh, mm);
}
function meusAvisos(){
  const agora = Date.now();
  return D.eventos.filter((e) => e.aviso && e.aviso !== 'nenhum' && (e.quem === S.perfil || e.quem === 'casal' || e.quem === 'lembrete')).map((e) => {
    const quando = proximaOcorrencia(e);
    const a = AVISOS.find((x) => x[0] === e.aviso);
    const inicio = quando.getTime() - (a[2] || 0) * 60000;
    const fim = quando.getTime() + (e.hora ? 2 : 24) * 3600000;
    return { e: e, quando: quando, ativo: agora >= inicio && agora <= fim };
  }).filter((x) => x.ativo).sort((a, b) => a.quando - b.quando);
}

// ---------- views ----------
function v(){ if (S.conectado === 'login') return telaLogin(); return S.perfil ? shell() : hello(); }
function hello(){
  return `<div class="hello">
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center">
      <div class="serif" style="font-size:26px;letter-spacing:.3em;color:var(--accent)">N&amp;L</div>
      <h1 style="font-size:40px">Quem está usando?</h1>
      <p class="muted" style="margin:0">Escolha seu perfil para entrar</p>
    </div>
    <div class="grid2" style="gap:16px">
      <button class="pick" data-a="entrar" data-p="nicole"><span class="av n">N</span>Nicole</button>
      <button class="pick" data-a="entrar" data-p="lucas"><span class="av l">L</span>Lucas</button>
    </div>
    <p class="muted" style="text-align:center;margin:0;font-size:12px">Uso pessoal · Nicole e Lucas</p>
  </div>`;
}
const TABS = {
  nicole: [['inicio','Início'],['gestao','Gestão'],['projetos','Projetos'],['videos','Vídeos'],['casa','Casa']],
  lucas: [['inicio','Início'],['clientes','Clientes'],['buscar','Buscar'],['estrategia','Estratégia'],['videos','Vídeos'],['casa','Casa']]
};
function shell(){
  const n = S.perfil === 'nicole';
  const views = { inicio: inicio, gestao: gestao, projetos: projetos, videos: videos, casa: casa, buscar: buscar, clientes: clientes, estrategia: estrategia, ajustes: ajustes };
  const body = (views[S.tab] || inicio)();
  return `<header class="top">
      <div class="who"><span class="av ${n ? 'n' : 'l'}">${n ? 'N' : 'L'}</span>${n ? 'Nicole' : 'Lucas'}</div>
      <div class="row">
        <button class="btn ghost sm" data-a="tab" data-t="ajustes" aria-label="Ajustes">Ajustes</button>
        <button class="btn ghost sm" data-a="sair">Trocar perfil</button>
      </div>
    </header>
    <main class="main">${conexaoBanner()}${pedidoCard()}${body}</main>
    <nav class="nav" aria-label="Navegação">${TABS[S.perfil].map(([id, l]) => `<button class="${S.tab === id ? 'on' : ''}" data-a="tab" data-t="${id}"><i></i>${l}</button>`).join('')}</nav>`;
}
function conexaoBanner(){

const ETAPAS = ['Novo contato','Qualificação','Visita','Proposta','Fechamento','Pós-venda'];
const CANAIS = ['WhatsApp','Instagram','Portal','Telefone','Indicação','Site'];
const PADRAO_SUGERIDO = 'Responder todo cliente em até 15 minutos no horário comercial\nApresentar-me com nome e Utu-Guaçu já na primeira mensagem\nEntender o perfil antes de mandar imóveis: finalidade, faixa de valor, região e prazo\nEnviar no máximo 3 opções bem escolhidas, com fotos e um comentário meu em cada\nConfirmar toda visita na véspera\nDar retorno em até 24 horas depois de cada visita\nNunca encerrar o dia com cliente aguardando resposta\nRegistrar cada contato no Kenlo';
const slaMin = () => parseInt(D.config.sla, 10) || 15;
const fmtDur = (m) => { m = Math.max(0, Math.round(m)); if (m < 60) return m + ' min'; if (m < 1440) { const h = Math.floor(m / 60), r = m % 60; return h + ' h' + (r ? ' ' + r + ' min' : ''); } const d = Math.floor(m / 1440); return d + (d === 1 ? ' dia' : ' dias'); };
const espera = (c) => c.aguardando && c.desde ? (Date.now() - c.desde) / 60000 : 0;
function nivel(min){ const s = slaMin(); if (min <= s) return ['No prazo', '#2F5D46']; if (min <= s * 4) return ['Atenção', '#8A5A12']; return ['Atrasado', '#9A3B2E']; }
function fila(){ return D.clientes.filter((c) => c.aguardando).sort((a, b) => (a.desde || 0) - (b.desde || 0)); }
function followHoje(){ const hj = hojeISO(); return D.clientes.filter((c) => !c.aguardando && c.proximoEm && c.proximoEm <= hj).sort((a, b) => a.proximoEm.localeCompare(b.proximoEm)); }
function stats7(){
  const lim = Date.now() - 7 * 86400000;
  const rs = []; D.clientes.forEach((c) => (c.respostas || []).forEach((r) => { if (r.em >= lim) rs.push(r.min); }));
  const media = rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : null;
  const noPrazo = rs.length ? Math.round(100 * rs.filter((m) => m <= slaMin()).length / rs.length) : null;
  const porEtapa = {}; ETAPAS.forEach((e) => { porEtapa[e] = 0; }); D.clientes.forEach((c) => { porEtapa[c.etapa || 'Novo contato'] = (porEtapa[c.etapa || 'Novo contato'] || 0) + 1; });
  const atrasados = followHoje().filter((c) => c.proximoEm < hojeISO()).length;
  return { respostas: rs.length, media: media, noPrazo: noPrazo, porEtapa: porEtapa, ativos: D.clientes.filter((c) => c.etapa !== 'Pós-venda').length, aguardando: fila().length, atrasados: atrasados };
}

  let ss = null, se = null;
  try { if (fid && ae.selectionStart != null) { ss = ae.selectionStart; se = ae.selectionEnd; } } catch (e) {}
  const y = window.scrollY;
  $app.innerHTML = v();

}

async function ask(key, prompt, onDone){
  if (!sample) { abrirPedido(key, prompt, onDone); return; }
  S.busy[key] = true; S.stream[key] = ''; render();
  try {
    const r = await sample(prompt, { modelTier: 'default', onText: ({ text }) => { S.stream[key] = text; render(); } });
    await onDone(r.text || S.stream[key]);
  } catch (e) {
    if (e && e.code === 'not_granted') { sample = null; toast('A IA não foi liberada.'); }
    else if (e && e.code === 'rate_limited') toast('Muitos pedidos seguidos. Tente em alguns minutos.');
    else toast('A IA não respondeu. Tente de novo.');
  }
  S.busy[key] = false; delete S.stream[key]; render();
}

// dictation wiring (after it resolves)
function webDict(){
  const R = window.SpeechRecognition || window.webkitSpeechRecognition; if (!R) return null;
  let rec = null, fin = null, st = null;
  return {
    start(){ rec = new R(); rec.lang = 'pt-BR'; rec.interimResults = false; rec.continuous = true;
      rec.onresult = (e) => { for (let i = e.resultIndex; i < e.results.length; i++) { if (e.results[i].isFinal && fin) fin({ text: e.results[i][0].transcript.trim() }); } };
      rec.onend = () => { if (st) st({ state: 'idle' }); }; rec.onerror = () => { if (st) st({ state: 'idle' }); };
      rec.start(); if (st) st({ state: 'listening' }); return Promise.resolve(); },
    stop(){ try { if (rec) rec.stop(); } catch (e) {} return Promise.resolve(); },
    onFinal(f){ fin = f; }, onState(f){ st = f; }
  };
}
function wireDict(){
  if (!dict) dict = webDict();
  if (!dict) return;
  try {
    dict.onFinal(({ text }) => { const cur = (S.drafts['bs-txt'] || '').trim(); S.drafts['bs-txt'] = (cur ? cur + ' ' : '') + text; render(); });
    dict.onState(({ state }) => { S.ouvindo = state === 'listening'; render(); });
  } catch (e) {}
}
const _boot = boot;
(async () => { await _boot(); wireDict(); })();
setInterval(() => { if (S.perfil && S.tab === 'inicio') render(); }, 60000);
})();

      const m=(await r.text()).match(/<p class="ver" hidden>([^<]*)<\/p>/);if(!m||m[1]===atual)return;
      let k="nl.upd."+m[1];try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,"1")}catch(_){}
      location.replace(location.pathname+"?v="+Date.now()+location.hash)}catch(_){}}
  window.addEventListener("load",()=>setTimeout(checar,1500));
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checar()});
})();
</script>
